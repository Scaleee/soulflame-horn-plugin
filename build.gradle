plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'soulflameaudio.SoulflameHornAudioLauncher'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	// mp3 decoding: RuneLite's audio player only reads what java.sound decodes, and plugins may not use java.sound.
	// RuneLite's own build of this player carries JLayer's decoder, and the plugin hub trusts net.runelite libraries.
	implementation group: 'net.runelite', name: 'jaco-mp3-player', version: '0.10.2-rl1'

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation 'org.mockito:mockito-core:3.12.4'
	testImplementation 'com.google.inject.extensions:guice-testlib:4.1.0'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'soulflameaudio'
version = '1.0-SNAPSHOT'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Guice 4.1 reflects into java.base, which is closed by default from JDK 16 onwards. The plugin hub
// builds on Java 11 where this is a no-op, but it is needed to run locally on a newer JDK.
def guiceJvmArgs = ['--add-opens', 'java.base/java.lang=ALL-UNNAMED']

tasks.named('test') {
	jvmArgs guiceJvmArgs
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	// An explicit cap is required: without one the JVM reserves a quarter of physical RAM as max heap,
	// which fails to commit on a loaded machine. The launcher's own 768m is not enough for a dev client
	// that also loads every installed hub plugin, so this runs a little higher.
	def heap = project.findProperty('heap') ?: '1280m'
	jvmArgs(["-ea", "-Xmx${heap}", "-Xss2m"] + guiceJvmArgs)

	args "--developer-mode", "--debug"

	// gradlew run -Pprofile=MyProfile
	if (project.hasProperty('profile')) {
		args "--profile", project.property('profile')
	}

	// Which credentials file inside ~/.runelite to log in with, letting two accounts run at once.
	// gradlew run -Pcreds=credentials-alt.properties
	if (project.hasProperty('creds')) {
		systemProperty 'runelite.credentials.path', project.property('creds')
	}
}

// Audition the bundled sounds without launching the client.
tasks.register('previewSounds', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'soulflameaudio.SoundPreview'
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
